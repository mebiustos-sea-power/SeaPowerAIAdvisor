[Language_en]
Name=Sea Power AI Advisor Prototype
Description=Gemini Flash-Lite advisor for tactical battles, with optional Dynamic Campaign integration. In battle, open AI in the bottom-right button row. Reads public mission objectives, own on-map units, player-observed contacts and published intelligence. English/Japanese UI; replies follow the game language. Configurable portrait and name, quick questions and local development JSON logs. Local gemini.json API key required. Requires Anchor Chain; DCM is optional. Restart after enabling or updating.

[Language_ja]
Name=Sea Power AI Advisor 試作版
Description=バニラの戦闘画面でも使えるGemini Flash-Liteアドバイザーです。戦闘中は右下のボタン列にあるAIから相談できます。公開目標・自軍の基本状態・観測接触・公開済み情報を段階取得し、ゲーム設定の言語で回答します。画像・名前の変更、定型相談、設定内の診断と開発用JSONログに対応。ローカルのgemini.jsonにAPIキーを設定してください。Anchor Chainが必要です。DCMは任意で、有効時はキャンペーン画面にも対応します。有効化・更新後はゲームを完全再起動してください。
