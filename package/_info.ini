[Language_en]
Name=Sea Power AI Advisor Prototype
Description=Operations adviser for tactical battles using Gemini, Ollama, OpenRouter or NanoGPT. Open AI in the bottom-right button row. Ask questions or assess unidentified contacts using player-known information. Specify locations from the map and review movement, sonobuoy deployment and formation return plans before approval. Markdown replies, custom advisers, quick actions, text templates and configurable provided-data categories. Register a named connection in Settings > API connections and select it for use. Requires a working Anchor Chain installation. Bungalow's Dynamic Campaign Mod is optional, with campaign-screen support in alpha and disabled by default. You supply credentials for cloud services. Completely restart Sea Power after enabling or updating.

[Language_ja]
Name=Sea Power AI Advisor 試作版
Description=Gemini・Ollama・OpenRouter・NanoGPTに対応した戦闘画面の作戦アドバイザーです。右下のAIボタンから相談でき、未識別接触の情報画面から見解も求められます。プレイヤー既知情報だけを使用。地図から地点を指定し、移動・ソノブイ投下・編隊復帰の計画を確認・承認して予約できます。Markdown表示、複数アドバイザー、定型相談・定型文、AIへ渡す情報の選択に対応。設定の「API接続」で接続を登録・選択してください。動作するAnchor Chainの導入が必要です。Bungalow's Dynamic Campaign Modは任意で、キャンペーン画面は初期OFFのアルファ対応です。クラウドサービスの認証情報は各自で用意してください。有効化・更新後はゲームを完全再起動してください。
