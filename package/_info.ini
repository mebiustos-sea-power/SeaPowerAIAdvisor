[Language_en]
Name=Sea Power AI Advisor Prototype
Description=AI adviser for tactical battles and independent screen translation using Gemini, Ollama, OpenRouter or NanoGPT. Open AI in the bottom-right button row to ask questions or assess unidentified contacts using player-known information. Review and approve plans combining movement, repeating patrol routes, sonobuoy deployment, formation return, sensors, EMCON and attack/cancellation commands. Select a Translation connection in Settings > API connections > Selection to enable screen translation (disabled by default); select a UI region to translate, then right-click Translate to restore original text. Includes Markdown replies, custom advisers and text templates. Requires a working Anchor Chain installation. Bungalow's Dynamic Campaign Mod is optional, with campaign-screen support in alpha and disabled by default. Supply your own credentials for cloud services. Completely restart Sea Power after enabling or updating.

[Language_ja]
Name=Sea Power AI Advisor 試作版
Description=Gemini・Ollama・OpenRouter・NanoGPTに対応した戦闘アドバイザーと、独立した画面翻訳機能です。右下のAIボタンから相談でき、未識別接触の情報画面から見解も求められます。プレイヤー既知情報を使い、移動・巡回ループ・ソノブイ投下・編隊復帰・センサー・EMCON・攻撃や取消しを組み合わせた計画を確認・承認して適用できます。画面翻訳は設定の「API接続」で翻訳用接続を選ぶと利用でき、初期状態では無効です。翻訳する範囲を選択し、翻訳ボタンの右クリックメニューから原文に戻せます。Markdown表示、複数アドバイザー、定型相談・定型文に対応。動作するAnchor Chainの導入が必要です。Bungalow's Dynamic Campaign Modは任意で、キャンペーン画面は初期OFFのアルファ対応です。クラウドサービスの認証情報は各自で用意してください。有効化・更新後はゲームを完全再起動してください。
