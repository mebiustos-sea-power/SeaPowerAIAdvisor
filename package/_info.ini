[Language_en]
Name=Sea Power AI Advisor Prototype
Description=Gemini Flash-Lite advisor for Dynamic Campaign. Sends victory conditions and requested player-known fleet and aviation information on manual consultation. Configurable portrait and name, quick consultation buttons, and diagnostics in Settings. English/Japanese UI follows game settings; other UI languages use English. Development logs save AI request/response JSON locally by default. Local gemini.json API key required. Open AI in the left strategy toolbar. Requires Anchor Chain and Dynamic Campaign Mod. Restart after enabling.

[Language_ja]
Name=Sea Power AI Advisor 試作版
Description=左のAIボタンからGemini Flash-Liteに相談できます。勝利条件と必要な自軍艦隊・航空戦力・公開情報を段階取得し、ゲーム設定の言語で回答します。画像と名前は設定やファイルから変更でき、画像下の定型ボタンからも相談できます。UIは英語・日本語に対応し、未対応言語では英語を表示します。診断は設定内にあります。開発用にAI送受信JSONをローカルへ記録します。ローカルのgemini.jsonにAPIキーを設定してください。状況確認・JSON表示は外部送信しません。Anchor ChainとDynamic Campaign Modが必要です。有効化後に再起動してください。
