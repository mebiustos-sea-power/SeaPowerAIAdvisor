Name=AI Advisor 外部コマンドサンプル
Description=AI AdvisorのコマンドSDK用サンプルです。ソノブイ投下予約の例を追加します。提案を採用すると実際にゲームへ予約を追加します。コマンドSDK対応版のAI AdvisorとAnchor Chainが必要です。
